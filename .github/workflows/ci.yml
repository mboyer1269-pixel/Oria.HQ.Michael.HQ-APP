name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Least-privilege token: CI only reads the repo (no writes, comments, or deploys).
permissions:
  contents: read

# Cancel superseded runs on the same ref so only the latest commit is validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        run: corepack enable pnpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Blocks on advisories in packages THIS repo declares. Transitive ones are
      # printed, not gated: their only "fix" is usually a forced major upgrade of
      # a parent, and a gate nobody can satisfy is a gate that gets disabled.
      - name: Direct dependency audit
        timeout-minutes: 5
        run: pnpm run audit:deps

      - name: Architecture layering guard
        run: pnpm run check:layering

      - name: System map is current
        run: pnpm run map:check

      - name: Build
        run: pnpm run build

      - name: Runtime smoke test
        run: pnpm run smoke:runtime

      - name: Joris smoke test
        run: pnpm run smoke:joris

      - name: Joris Memex evidence smoke test
        run: pnpm run smoke:joris:memex-evidence

      - name: Unit tests
        run: pnpm test

      - name: Ledger hash-chain audit
        run: pnpm run ledger:audit

      - name: Ledger hash-chain migration draft check
        run: pnpm run ledger:check-migration-draft

      - name: Ledger hash-chain not-live guard
        run: pnpm run ledger:guard-not-live

      - name: Mission persistence migration draft check
        run: pnpm run mission:check-migration-draft

      - name: Mission persistence not-live guard
        run: pnpm run mission:guard-not-live

  # Wiring tripwires, deliberately separate from `verify`.
  #
  # `*-gap.test.mjs` files assert that something already built is actually
  # called. They are RED ON PURPOSE while a gap is open and turn green on their
  # own once the wiring lands — so a red `gap-check` is a debt indicator, not a
  # broken build.
  #
  # Why its own job rather than a step inside `verify`:
  #   * A step marked continue-on-error produces no status on the pull request.
  #     The gap would only be visible to someone who opened the run and read the
  #     log — a signal you have to go looking for is one that stops being found.
  #   * A separate job surfaces a named check next to a green `verify`, so the
  #     two signals stay legible and disjoint. `verify` answers "does the app
  #     build and work"; `gap-check` answers "is anything built but unwired".
  #   * Jobs run in parallel, so wall-clock is unaffected. The cost is one extra
  #     `npm ci` in runner minutes, which is proportionate.
  #
  # No continue-on-error here: this check is meant to fail while the debt exists.
  gap-check:
    name: gap-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        run: corepack enable pnpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Wiring gap check
        run: pnpm run test:gaps
