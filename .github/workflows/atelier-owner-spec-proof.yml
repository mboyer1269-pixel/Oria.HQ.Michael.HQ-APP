name: Owner spec v2 validation candidate

# Validation-only stack on PR462; no production migration or runtime activation.
on:
  pull_request:
    branches: ['builder/atelier-boundary-validation', 'main']
permissions:
  contents: read
concurrency:
  group: owner-spec-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-spec-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --ignore-scripts
      - name: Scoped unit + controlled fake-child tests (no provider)
        run: >-
          node --test src/server/missions/atelier-owner-spec-*.test.mjs
          src/server/atelier/atelier-bound-spec.test.mjs proofs/owner-spec-proof.test.mjs
          src/core/runtime-capability-inventory.test.mjs
          src/server/missions/atelier-execution-*.test.mjs
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node node_modules/eslint/bin/eslint.js src eslint.config.mjs next.config.ts postcss.config.mjs
      - run: node scripts/architecture/system-map.mjs --check
      - run: node scripts/architecture/check-layering.mjs
      - run: node node_modules/next/dist/bin/next build
      - run: node src/scripts/smoke/joris-booking.mjs
  owner-spec-real-db-fake-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: oria_test_owner_spec
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d oria_test_owner_spec"
          --health-interval 2s --health-timeout 5s --health-retries 30
      postgrest:
        image: postgrest/postgrest:v12.2.0
        env:
          PGRST_DB_URI: postgres://postgres@postgres:5432/oria_test_owner_spec
          PGRST_DB_ANON_ROLE: qualification_service
          PGRST_DB_SCHEMAS: public
        ports: ['3000:3000']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci --ignore-scripts
      - name: Real isolated G1 + v2 transactions and controlled fake CLI
        env:
          CI_PG_URL: postgres://postgres@127.0.0.1:5432/oria_test_owner_spec
          POSTGREST_DIRECT_URL: http://127.0.0.1:3000
        run: |
          set -o pipefail
          node proofs/prove-owner-spec-real-db.mjs --run 2>&1 | tee /tmp/owner-spec-db-proof.log
          grep -Fx 'OBSERVED_OWNER_SPEC_WAITERS=2' /tmp/owner-spec-db-proof.log
          grep -Fx 'UNEXPECTED_NETWORK=0' /tmp/owner-spec-db-proof.log
          grep -Fx 'ALL 13 OWNER-SPEC REAL-DB FAKE-CLI PROOFS PASSED' /tmp/owner-spec-db-proof.log
